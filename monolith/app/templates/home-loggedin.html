{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Home - Audio Recorder</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <style>
    /* Optional: basic styling for the analysis container */
    #analysis-container ul {
      list-style: disc;
      padding-left: 20px;
    }
  </style>
</head>
<body>
  <h2>Welcome, {{ request.user.username }}</h2>
  <p><a href="{{ logout_url }}">log out</a></p>
  <p>Your conversation may continue automatically.</p>
  <div id="server-response"></div>
  
  <!-- New container for conversation analysis -->
  <div id="analysis-container">
    Loading conversation analysis...
  </div>

  <script type="module">
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    let conversationId = "{{ conversation_id }}";
    
    // 1. Request microphone access
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    
    // 2. Set up AudioContext and load the meter processor from static files
    const ctx = new AudioContext({ sampleRate: 16000 });
    await ctx.audioWorklet.addModule("{% static 'meter-processor.js' %}");
    
    const source = ctx.createMediaStreamSource(stream);
    const meter = new AudioWorkletNode(ctx, 'meter');
    source.connect(meter);
    
    // Optional: define an encoder for audio data (for demo, use binary data)
    const mu6encoder = (x => Math.floor((Math.sign(x) * Math.log1p(63 * Math.abs(x)) / Math.log1p(63) + 1) / 2 * 63 + 0.5));
    const mupalette = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_";
    
    // 3. Receive stats from the meter processor and post data to the API endpoint
    meter.port.onmessage = async ({ data: { max, sd, frame } }) => {
      console.log(`max = ${max.toFixed(4)}  sd = ${sd.toFixed(4)}`);
      const mu6frame = frame.map(i => mu6encoder(i));
      const mu6string = mu6frame.map(x => mupalette[x]).join('');
      console.log({ mu6string, mu6frame, frame });
      
      // Prepare form data to send
      const clientTimestamp = new Date().toISOString();
      const formData = new FormData();
      
      formData.append('audio_data', mu6string);
      formData.append('client_timestamp', clientTimestamp);
      formData.append('conversation_id', conversationId);
      
      try {
        const response = await fetch('/api/upload/', {
          method: 'POST',
          body: formData,
          credentials: 'include',
          headers: {
            'X-CSRFToken': csrfToken
          }
        });
        const result = await response.json();
        console.log(result);
      } catch (err) {
        console.error("Upload failed", err);
      }
    };
    
    // Resume AudioContext if suspended (e.g., in Safari)
    if (ctx.state === 'suspended') {
      await ctx.resume();
    }
    
    // ANALYSIS: Fetch conversation analysis every 0.5 seconds
    const analysisContainer = document.getElementById("analysis-container");
    
    const smoothStep = function (x, y, a) {
      return x + (y - x) * a * a * (3 - 2 * a);
    };
    
    async function fetchAnalysis() {
      try {
        const response = await fetch(`/api/analysis/?conversation_id=${conversationId}`, {
          credentials: 'include'
        });
        const data = await response.json();
        const transcriptions = data.transcriptions;
        // Get the first ten transcriptions (if available)
        const firstTen = transcriptions.slice(0, 10);
        
        // Build the bulleted list
        if (!firstTen.length) {
          analysisContainer.innerHTML = "<p>No transcriptions yet.</p>";
          return;
        }
        
        const ul = document.createElement('ul');
        const startOpacity = 1.0;
        const endOpacity = 0.0;
        
        firstTen.forEach((t, index, arr) => {
            const li = document.createElement('li');
            li.textContent = t.fast_transcription || "...";
            const opacity = smoothStep(startOpacity, endOpacity, index / arr.length);
            li.style.opacity = opacity;
            ul.appendChild(li);
        });
        analysisContainer.innerHTML = '';  // Clear previous content
        analysisContainer.appendChild(ul);
      } catch (err) {
        console.error("Failed to fetch analysis", err);
      }
    }
    
    // Fetch analysis every 0.5 seconds
    setInterval(fetchAnalysis, 500);
    // Initial call
    fetchAnalysis();
  </script>
</body>
</html>
